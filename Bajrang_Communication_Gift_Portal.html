<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bajrang Communication Gift Portal</title><style>
body{font-family:Arial;margin:0;background:#101827;color:#fff}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#1d293b;padding:18px;border-radius:16px;margin:15px 0}input,button,select{padding:12px;border-radius:9px;margin:5px;border:0}input,select{width:90%;background:#0b1220;color:#fff}button{background:#f59e0b;font-weight:bold}.danger{background:#dc2626;color:#fff}.ok{background:#16a34a;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ffffff22;text-align:left;font-size:12px}.menu{float:right}.gift{font-size:25px;color:#fbbf24}</style></head><body><div class="wrap">
<div><h1>Bajrang Communication</h1><button class="menu" onclick="document.getElementById('admin').classList.toggle('hidden')">⋮ Admin</button><p>Gift • Scratch • Spin & Win</p></div>
<section class="card"><h2>🎁 Customer Gift</h2><div class="grid"><input id="name" placeholder="Customer Name"><input id="mob" maxlength="10" inputmode="numeric" placeholder="Mobile (10 digits)"><input id="imei" maxlength="15" inputmode="numeric" placeholder="IMEI (15 digits)"></div><button onclick="scratch()">Scratch / Spin शुरू करें</button><div id="out"></div></section>
<section class="card"><h2>🔎 Status Check</h2><input id="sm" maxlength="10" placeholder="Mobile 10 digits"><input id="si" maxlength="15" placeholder="IMEI 15 digits"><button onclick="status()">Status देखें</button><div id="sout"></div></section>
<section id="admin" class="card hidden"><div id="login"><h2>🔐 Admin Login</h2><input id="aid" placeholder="Admin ID"><input id="apass" type="password" placeholder="Password"><button onclick="login()">Login</button><p>Demo: admin / 1234</p></div><div id="dash" class="hidden"><h2>⚙️ Admin Dashboard</h2><button onclick="logout()">Logout</button><h3>Pending / All Gifts</h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Mobile</th><th>IMEI</th><th>Gift</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><h3>Gift Management</h3><input id="newgift" placeholder="नया Gift"><button onclick="addGift()">Gift जोड़ें</button><select id="gifts"></select></div></section>
</div><script>
const RK='bc_records',GK='bc_gifts';let gifts=JSON.parse(localStorage.getItem(GK)||'["Bluetooth","Smart Watch","Earbuds"]');
const rec=()=>JSON.parse(localStorage.getItem(RK)||'[]');const save=a=>localStorage.setItem(RK,JSON.stringify(a));
function scratch(){let n=name.value.trim(),m=mob.value.trim(),i=imei.value.trim();if(!n)return out.innerHTML='<p>नाम भरें।</p>';if(!/^\d{10}$/.test(m))return out.innerHTML='<p>❌ Mobile ठीक 10 digits का होना चाहिए।</p>';if(!/^\d{15}$/.test(i))return out.innerHTML='<p>❌ IMEI ठीक 15 digits का होना चाहिए।</p>';let a=rec();if(a.some(x=>x.imei===i))return out.innerHTML='<p>❌ यह IMEI पहले से इस्तेमाल हो चुका है।</p>';let g=gifts[Math.floor(Math.random()*gifts.length)];a.push({n,m,i,g,st:'Pending',d:new Date().toLocaleString('en-IN')});save(a);out.innerHTML='<div class="gift">🎉 '+g+'</div><p>Status: Pending</p>'}
function status(){let m=sm.value.trim(),i=si.value.trim();if(!/^\d{10}$/.test(m)||!/^\d{15}$/.test(i))return sout.innerHTML='<p>❌ Mobile 10 और IMEI 15 digits होना चाहिए।</p>';let r=rec().find(x=>x.m===m&&x.i===i);sout.innerHTML=r?`<p>Gift: <b>${r.g}</b><br>Status: <b>${r.st}</b><br>${r.d}</p>`:'<p>Record नहीं मिला।</p>'}
function login(){if(aid.value==='admin'&&apass.value==='1234'){loginBox=login;document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');render()}else alert('Wrong Admin ID/Password')}
function logout(){document.getElementById('dash').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function render(){rows.innerHTML=rec().map((r,k)=>`<tr><td>${r.n}</td><td>${r.m}</td><td>${r.i}</td><td>${r.g}</td><td>${r.st}</td><td>${r.st==='Pending'?`<button class="ok" onclick="setst(${k},'Completed')">Approve</button><button class="danger" onclick="setst(${k},'Removed')">Remove</button>`:`<button class="danger" onclick="del(${k})">Delete</button>`}</td></tr>`).join('')||'<tr><td colspan="6">No records</td></tr>';giftsEl()}
function setst(k,s){let a=rec();a[k].st=s;save(a);render()}function del(k){let a=rec();a.splice(k,1);save(a);render()}function addGift(){let x=newgift.value.trim();if(x&&!gifts.includes(x)){gifts.push(x);localStorage.setItem(GK,JSON.stringify(gifts));newgift.value='';giftsEl()}}function giftsEl(){giftsElx=document.getElementById('gifts');giftsElx.innerHTML=gifts.map(x=>`<option>${x}</option>`).join('')}
</script></body></html>
